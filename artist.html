<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>아티스트 아카이브</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #F4F5F0; color: #111; font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; letter-spacing: -0.02em; margin: 0; padding: 60px 20px 90px 20px; }
    header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #F4F5F0; display: flex; align-items: center; justify-content: center; z-index: 1000; border-bottom: 2px solid #111; }
    header h1 { font-size: 1.2rem; margin: 0; color: #111; font-weight: 900; letter-spacing: -0.5px; }
    
    .artist-wrapper { margin: 20px 0 25px 0; }
    
    .artist-cloud { display: flex; flex-wrap: wrap; gap: 10px; max-height: 102px; overflow: hidden; padding: 2px 2px 6px 2px; transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .artist-cloud.expanded { max-height: 2000px; }

    .artist-btn { background: #fff; border: 2px solid #111; box-shadow: 2px 2px 0px #111; padding: 7px 14px; border-radius: 20px; font-weight: 800; font-size: 0.95rem; color: #111; cursor: pointer; transition: transform 0.05s, box-shadow 0.05s; display: flex; align-items: center; gap: 8px; font-family: inherit; height: 40px; margin: 0; }
    .artist-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #111; }
    .artist-btn.active { background: #2563EB; color: #fff; box-shadow: 2px 2px 0px #111; }
    .artist-btn .count { background: #111; color: #D9F99D; border-radius: 50%; width: 22px; height: 22px; display: flex; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: 900; }
    .artist-btn.active .count { background: #fff; color: #2563EB; }

    .toggle-more-btn { display: none; width: 100%; background: none; border: none; padding: 12px 0 4px 0; font-size: 0.85rem; font-weight: 800; color: #6B7280; cursor: pointer; text-align: center; font-family: inherit; }
    .toggle-more-btn:active { color: #111; transform: scale(0.96); }

    .card-list { display: flex; flex-direction: column; gap: 20px; }
    .record-card { background: #fff; border-radius: 16px; padding: 20px; text-decoration: none; color: inherit; display: block; border: 2px solid #111; box-shadow: 4px 4px 0px #111; transition: transform 0.05s, box-shadow 0.05s; }
    .record-card:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #111; } 
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-title { font-size: 1.2rem; font-weight: 800; margin: 0; color: #111; line-height: 1.3; }
    .price { color: #2563EB; font-weight: 800; }
    .artist-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .artist-tag { background: #2563EB; color: #fff; font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; font-weight: 700; border: 1.5px solid #111; }
    .card-info { color: #555; font-size: 0.9rem; margin: 4px 0; display: flex; gap: 10px; font-weight: 600; }
    
    .artist-total-summary { text-align: center; color: #9CA3AF; font-size: 0.85rem; font-weight: 600; margin: 15px 0 25px 0; letter-spacing: -0.3px; }
    .empty-msg { text-align: center; color: #888; font-weight: 700; padding: 40px 0; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; align-items: center; height: 70px; border-top: 2px solid #111; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
    .bottom-nav a { color: #888; text-decoration: none; font-size: 0.8rem; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.2s, transform 0.05s; }
    .bottom-nav a:active { transform: scale(0.92); }
    .bottom-nav a.active { color: #2563EB; }
    
    .bottom-nav .add-btn { background: #2563EB; color: #fff !important; width: 56px; height: 56px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; margin-top: -30px; border: 2px solid #111; box-shadow: 2px 2px 0px #111; transition: transform 0.05s, box-shadow 0.05s; }
    .bottom-nav .add-btn:active { transform: translate(2px, -28px); box-shadow: 0px 0px 0px #111; }
  </style>
</head>
<body ontouchstart="">
  <header><h1>ARTIST ARCHIVE</h1></header>

  <div class="artist-wrapper">
    <div class="artist-cloud" id="artist-cloud"></div>
    <button id="toggle-more-btn" class="toggle-more-btn" onclick="toggleArtistCloud()">더보기 ▾</button>
  </div>

  <div class="card-list" id="card-list">
    <div class="empty-msg">데이터를 불러오는 중입니다... ⏳</div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span>HOME</span></a>
    <a href="artist.html" class="active"><span>ARTIST</span></a>
    <a href="add.html" class="add-btn">+</a>
    <a href="calendar.html"><span>CALENDAR</span></a>
  </nav>

  <script>
    const currentUser = localStorage.getItem("rockArchiveUser");
    if (!currentUser) window.location.href = "login.html";

    const scriptUrl = "https://script.google.com/macros/s/AKfycbxlYgTHF-G5RhLTd6rIXKVYaXlZyVHLzh8ZdG4_gMvwhqTSNRQ0xokYrg33EV0a-3v8/exec";
    const artistCloud = document.getElementById('artist-cloud');
    const toggleBtn = document.getElementById('toggle-more-btn');
    const cardList = document.getElementById('card-list');
    
    let allGigs = [];
    let isExpanded = false;

    function formatDateStr(dateVal) {
      if (!dateVal) return '';
      const str = String(dateVal).trim();
      const match = str.match(/(\d{4})[-\.\/](\d{1,2})[-\.\/](\d{1,2})/);
      if (match) {
        return `${match[1]}.${match[2].padStart(2, '0')}.${match[3].padStart(2, '0')}`;
      }
      return str.substring(0, 10).replace(/-/g, '.');
    }

    function toggleArtistCloud() {
      isExpanded = !isExpanded;
      if (isExpanded) {
        artistCloud.classList.add('expanded');
        toggleBtn.innerText = '접기 ▴';
      } else {
        artistCloud.classList.remove('expanded');
        toggleBtn.innerText = '더보기 ▾';
      }
    }

    fetch(`${scriptUrl}?user=${encodeURIComponent(currentUser)}`)
      .then(res => res.json())
      .then(gigs => {
        allGigs = gigs;
        let artistStats = {};
        
        gigs.forEach(gig => {
          const gigDate = formatDateStr(gig.date);
          const arr = gig.artist ? String(gig.artist).split(',').map(a => a.trim()).filter(a => a !== "") : [];
          
          arr.forEach(a => {
            if (!artistStats[a]) {
              artistStats[a] = { count: 0, latestDate: gigDate };
            }
            artistStats[a].count += 1;
            if (gigDate > artistStats[a].latestDate) {
              artistStats[a].latestDate = gigDate;
            }
          });
        });

        const sortedArtists = Object.keys(artistStats).sort((a, b) => {
          if (artistStats[b].count !== artistStats[a].count) {
            return artistStats[b].count - artistStats[a].count;
          }
          return artistStats[b].latestDate.localeCompare(artistStats[a].latestDate);
        });

        if (sortedArtists.length === 0) {
          artistCloud.innerHTML = '';
          cardList.innerHTML = '<div class="empty-msg">저장된 아티스트가 없습니다.</div>';
        } else {
          artistCloud.innerHTML = ''; 
          cardList.innerHTML = '<div class="empty-msg">위에서 아티스트를 선택해보세요! 🎸</div>';
          
          sortedArtists.forEach(artist => {
            const count = artistStats[artist].count;
            const btn = document.createElement('button');
            btn.className = 'artist-btn';
            btn.innerHTML = `${artist} <span class="count">${count}</span>`;
            btn.onclick = () => filterGigs(artist, btn);
            artistCloud.appendChild(btn);
          });

          setTimeout(() => {
            if (artistCloud.scrollHeight > 105) {
              toggleBtn.style.display = 'block';
            }
          }, 50);
        }
      });

    function filterGigs(artistName, clickedBtn) {
      document.querySelectorAll('.artist-btn').forEach(b => b.classList.remove('active'));
      clickedBtn.classList.add('active');

      const filteredGigs = allGigs.filter(gig => {
        let arr = gig.artist ? String(gig.artist).split(',').map(a => a.trim()) : [];
        return arr.includes(artistName);
      });

      filteredGigs.sort((a, b) => formatDateStr(b.date).localeCompare(formatDateStr(a.date)));

      let totalCost = 0;
      let html = '';

      filteredGigs.forEach(gig => {
        totalCost += Number(gig.price) || 0;
        const formattedDate = formatDateStr(gig.date);
        const artistBadgesHtml = gig.artist ? String(gig.artist).split(',').map(a => `<span class="artist-tag">${a.trim()}</span>`).join('') : '';
        
        html += `
          <a href="detail.html?id=${gig.id}" class="record-card">
            <div class="card-header"><h2 class="card-title">${gig.title}</h2><span class="price">₩ ${Number(gig.price || 0).toLocaleString()}</span></div>
            <div class="artist-group">${artistBadgesHtml}</div>
            <div class="card-info"><span>📅 ${formattedDate.substring(2)}</span> <span>📍 ${gig.location || ''}</span></div>
          </a>
        `;
      });

      html += `
        <div class="artist-total-summary">
          총 ${filteredGigs.length}회 관람 · ₩ ${totalCost.toLocaleString()}
        </div>
      `;

      cardList.innerHTML = html;
    }
  </script>
</body>
</html>
