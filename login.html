<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROCK ARCHIVE - LOGIN</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    * { box-sizing: border-box; }
    body { background-color: #F4F5F0; color: #111; font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; letter-spacing: -0.02em; margin: 0; padding: 40px 20px; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
    
    .login-card { background: #fff; border: 2px solid #111; border-radius: 20px; padding: 32px 24px; box-shadow: 4px 4px 0px #111; text-align: center; max-width: 400px; margin: 0 auto; width: 100%; }
    .brand-title { font-size: 1.6rem; font-weight: 900; margin: 0 0 8px 0; letter-spacing: -0.5px; }
    
    /* 락스타 경고 뱃지 (그림자 제거) */
    .warning-badge { display: inline-block; background: #FEE2E2; color: #DC2626; border: 1.5px solid #111; font-size: 0.8rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; margin-bottom: 8px; box-shadow: none; }
    .brand-subtitle { font-size: 0.95rem; font-weight: 700; color: #666; margin: 0 0 28px 0; }

    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 800; margin-bottom: 8px; color: #111; }
    .form-group input { width: 100%; background: #F4F5F0; border: 2px solid #111; padding: 16px; border-radius: 12px; font-size: 1.05rem; font-weight: 700; outline: none; font-family: inherit; transition: 0.2s; }
    .form-group input:focus { background: #fff; box-shadow: 3px 3px 0px #2563EB; transform: translate(-1px, -1px); }

    /* 입장 버튼 (그림자 제거) */
    .login-btn { width: 100%; background: #2563EB; color: #fff; border: 2px solid #111; padding: 18px; border-radius: 12px; font-size: 1.1rem; font-weight: 900; margin-top: 15px; cursor: pointer; box-shadow: none; transition: opacity 0.1s; font-family: inherit; }
    .login-btn:active { opacity: 0.85; }
    .login-btn:disabled { background: #888; cursor: not-allowed; opacity: 0.6; }

    .help-text { font-size: 0.85rem; font-weight: 600; color: #777; margin-top: 22px; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="login-card">
    <h1 class="brand-title">ROCK ARCHIVE 🤘</h1>
    <div class="warning-badge">⚠️ 락스타를 사랑하지 마세요</div>
    <p class="brand-subtitle">하지만 공연 기록은 남겨야 하니까</p>

    <form id="login-form">
      <div class="form-group">
        <label>🎤 닉네임</label>
        <input type="text" id="username" placeholder="예: 유재, 온유" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>🔒 비밀번호 (PIN 4자리)</label>
        <input type="password" id="pin" placeholder="숫자 4자리" inputmode="numeric" required autocomplete="current-password">
      </div>

      <button type="submit" class="login-btn" id="submit-btn">입장하기 🚀</button>
    </form>

    <p class="help-text">
      처음 오셨다면 입력한 닉네임과 비밀번호로<br><strong>자동 등록 및 아카이브가 생성</strong>됩니다!
    </p>
  </div>

  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbxlYgTHF-G5RhLTd6rIXKVYaXlZyVHLzh8ZdG4_gMvwhqTSNRQ0xokYrg33EV0a-3v8/exec";

    if (localStorage.getItem("rockArchiveUser")) {
      window.location.href = "index.html";
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const btn = document.getElementById('submit-btn');

      btn.innerText = "확인 중... ⏳";
      btn.disabled = true;

      fetch(scriptUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: "auth", username: username, pin: pin })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          localStorage.setItem("rockArchiveUser", res.username);
          if (res.isNew) {
            alert(`반가워요, ${res.username}님! 새 아카이브가 생성되었습니다. 🎸`);
          }
          window.location.href = "index.html";
        } else {
          alert(res.message || "로그인 실패");
          btn.innerText = "입장하기 🚀";
          btn.disabled = false;
        }
      })
      .catch(err => {
        alert("서버 연결에 실패했습니다. 다시 시도해주세요.");
        btn.innerText = "입장하기 🚀";
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
