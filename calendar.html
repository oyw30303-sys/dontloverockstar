<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>달력 보기</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    * { box-sizing: border-box; }
    body { background-color: #F4F5F0; color: #111; font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; letter-spacing: -0.02em; margin: 0; padding: 60px 15px 90px 15px; }
    header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #F4F5F0; display: flex; align-items: center; justify-content: center; z-index: 1000; border-bottom: 2px solid #111; }
    header h1 { font-size: 1.1rem; margin: 0; color: #111; font-weight: 900; letter-spacing: -0.5px; }

    .month-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 25px 0; }
    .nav-btn { background: #fff; border: 2px solid #111; box-shadow: 2px 2px 0px #111; width: 44px; height: 44px; border-radius: 12px; font-size: 1.1rem; font-weight: 900; color: #111; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.1s, box-shadow 0.1s; font-family: inherit; }
    .nav-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #111; }
    
    .month-input { background: #D9F99D; border: 2px solid #111; box-shadow: 3px 3px 0px #111; padding: 8px 15px; border-radius: 12px; font-size: 1.3rem; font-weight: 900; font-family: inherit; color: #111; cursor: pointer; outline: none; text-align: center; letter-spacing: 1px; }

    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .day-name { text-align: center; font-size: 0.8rem; color: #555; padding-bottom: 10px; font-weight: 800; }
    
    .day { background: #fff; aspect-ratio: 1 / 1.15; border-radius: 8px; padding: 6px; position: relative; display: flex; flex-direction: column; border: 2px solid #111; box-shadow: 2px 2px 0px #111; }
    .day-num { font-size: 0.9rem; color: #111; font-weight: 700; }
    
    .has-gig { background: #2563EB; border: 2px solid #111; box-shadow: 2px 2px 0px #111; text-decoration: none; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; aspect-ratio: 1 / 1.15; border-radius: 8px; transition: transform 0.1s, box-shadow 0.1s; }
    .has-gig:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #111; }
    .has-gig .day-num { color: #fff; font-size: 0.9rem; font-weight: 800; }
    .has-gig .drum-icon { font-size: 1rem; text-align: right; line-height: 1; }
    
    .empty { background: transparent; border: none; box-shadow: none; }
    .loading-msg { text-align: center; color: #888; font-weight: 700; padding: 20px; }

    /* 하단 회색 요약 텍스트 스타일 */
    .calendar-total-summary { text-align: center; color: #9CA3AF; font-size: 0.85rem; font-weight: 600; margin: 25px 0 10px 0; letter-spacing: -0.3px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; align-items: center; height: 70px; border-top: 2px solid #111; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
    .bottom-nav a { color: #888; text-decoration: none; font-size: 0.8rem; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bottom-nav a.active { color: #2563EB; }
    
    .bottom-nav .add-btn { background: #2563EB; color: #fff !important; width: 56px; height: 56px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; margin-top: -30px; border: 2px solid #111; box-shadow: none; transition: transform 0.1s; }
    .bottom-nav .add-btn:active { transform: translate(2px, 2px); }
  </style>
</head>
<body>
  <header><h1>CALENDAR</h1></header>

  <div class="month-header">
    <button class="nav-btn" id="prev-btn">◀</button>
    <div style="position: relative;">
      <input type="month" class="month-input" id="month-input" min="2016-01" max="2036-12" onclick="try{this.showPicker();}catch(e){}">
    </div>
    <button class="nav-btn" id="next-btn">▶</button>
  </div>

  <div id="loading-indicator" class="loading-msg">달력 정보 동기화 중... ⏳</div>
  <div class="grid" id="calendar-grid" style="display:none;"></div>
  <div id="calendar-summary" class="calendar-total-summary"></div>

  <nav class="bottom-nav">
    <a href="index.html"><span>HOME</span></a>
    <a href="artist.html"><span>ARTIST</span></a>
    <a href="add.html" class="add-btn">+</a>
    <a href="calendar.html" class="active"><span>CALENDAR</span></a>
  </nav>

  <script>
    const currentUser = localStorage.getItem("rockArchiveUser");
    if (!currentUser) {
      window.location.href = "login.html";
    }

    const scriptUrl = "https://script.google.com/macros/s/AKfycbxR-8LeeH1CtcrG5pdu9gRIpuIU54SYWwssgHWdGv8twzvt_pq0qUtVvDxb6z9CiitS/exec";
    const calendarGrid = document.getElementById('calendar-grid');
    const calendarSummary = document.getElementById('calendar-summary');
    const monthInput = document.getElementById('month-input');
    let currentDate = new Date(); 
    let allGigs = [];

    fetch(`${scriptUrl}?user=${encodeURIComponent(currentUser)}`)
      .then(res => res.json())
      .then(gigs => {
        allGigs = gigs;
        document.getElementById('loading-indicator').style.display = 'none';
        calendarGrid.style.display = 'grid';
        renderCalendar(currentDate);
      });

    function renderCalendar(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const monthString = String(month + 1).padStart(2, '0');
      monthInput.value = `${year}-${monthString}`;

      let html = `<div class="day-name">SUN</div><div class="day-name">MON</div><div class="day-name">TUE</div><div class="day-name">WED</div><div class="day-name">THU</div><div class="day-name">FRI</div><div class="day-name">SAT</div>`;
      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      let monthGigCount = 0;
      let monthTotalCost = 0;

      for (let i = 0; i < firstDayIndex; i++) html += `<div class="day empty"></div>`;
      for (let i = 1; i <= lastDate; i++) {
        const currentDayStr = `${year}-${monthString}-${String(i).padStart(2, '0')}`;
        
        const gigOnThisDay = allGigs.find(g => {
          if (!g.date) return false;
          return String(g.date).substring(0, 10) === currentDayStr;
        });
        
        if (gigOnThisDay) {
          monthGigCount++;
          monthTotalCost += Number(gigOnThisDay.price) || 0;
          html += `
            <a href="detail.html?id=${gigOnThisDay.id}" class="has-gig">
              <span class="day-num">${i}</span>
              <span class="drum-icon">🥁</span>
            </a>
          `;
        } else {
          html += `<div class="day"><span class="day-num">${i}</span></div>`;
        }
      }
      calendarGrid.innerHTML = html;

      // 하단 월별 합계 표시
      if (monthGigCount > 0) {
        calendarSummary.innerText = `이 달 총 ${monthGigCount}회 관람 · ₩ ${monthTotalCost.toLocaleString()}`;
      } else {
        calendarSummary.innerText = `이 달 관람한 공연이 없습니다.`;
      }
    }

    document.getElementById('prev-btn').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(currentDate); });
    document.getElementById('next-btn').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(currentDate); });
    monthInput.addEventListener('change', (e) => {
      const [year, month] = e.target.value.split('-');
      currentDate = new Date(year, month - 1, 1); 
      renderCalendar(currentDate);
    });
  </script>
</body>
</html>
