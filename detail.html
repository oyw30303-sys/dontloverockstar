<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>상세 후기</title>
  <style>
    body { background-color: #F4F5F0; color: #111; font-family: -apple-system, sans-serif; margin: 0; padding: 60px 0 20px 0; }
    header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #F4F5F0; display: flex; align-items: center; padding: 0 20px; z-index: 1000; border-bottom: 2px solid #111; }
    .back-btn { color: #111; text-decoration: none; font-size: 1.5rem; font-weight: 900; margin-right: 15px; }
    
    .hero { padding: 35px 20px; border-bottom: 2px solid #111; background-color: #fff; }
    .artist-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .artist-badge { background: #D9F99D; color: #111; font-size: 0.85rem; padding: 4px 12px; border-radius: 20px; font-weight: 900; border: 2px solid #111; }
    h1 { font-size: 1.9rem; font-weight: 900; margin: 0 0 25px 0; line-height: 1.3; }
    
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 2px solid #111; border-radius: 12px; overflow: hidden; }
    .meta-item { background: #fff; padding: 15px; display: flex; flex-direction: column; border-right: 2px solid #111; border-bottom: 2px solid #111; }
    .meta-item:nth-child(2n) { border-right: none; }
    .meta-item:last-child { border-bottom: none; grid-column: 1 / -1; } 
    .meta-item span { color: #555; font-size: 0.75rem; margin-bottom: 4px; font-weight: 800; letter-spacing: 1px; }
    .meta-item strong { color: #111; font-size: 1rem; font-weight: 800; }
    .meta-item .price { color: #2563EB; font-size: 1.2rem; font-weight: 900; }
    
    .review-content { padding: 30px 20px; line-height: 1.8; font-size: 1.1rem; font-weight: 600; color: #222; white-space: pre-wrap; }
    
    .action-buttons { display: flex; gap: 15px; margin: 0 20px 40px 20px; }
    .btn-hip { flex: 1; text-align: center; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: 900; border: 2px solid #111; box-shadow: 4px 4px 0px #111; cursor: pointer; text-decoration: none; display: flex; justify-content: center; align-items: center; transition: transform 0.1s, box-shadow 0.1s; }
    .btn-hip:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #111; }
    
    .edit-btn { background: #D9F99D; color: #111; }
    .delete-btn { background: #FF4A4A; color: #fff; }
    .loading-msg { padding: 40px 20px; font-weight: 800; color: #2563EB; text-align: center; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn">←</a>
  </header>

  <div id="content-container">
    <div class="loading-msg">정보를 불러오는 중입니다... ⏳</div>
  </div>
  
  <div class="action-buttons" id="action-buttons" style="display:none;">
    <a href="#" id="edit-btn" class="btn-hip edit-btn">기록 수정 ✏️</a>
    <button id="delete-btn" class="btn-hip delete-btn">기록 삭제 🗑️</button>
  </div>

  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbyJ6jZDpg6sL33-GW8RBDzTMJ5Xp9CJbJ6o-OrcvceKMyVG1DdxGA2IKJblVbgu1T-x/exec";
    const params = new URLSearchParams(window.location.search);
    const gigId = params.get('id');

    fetch(scriptUrl)
      .then(res => res.json())
      .then(gigs => {
        const gig = gigs.find(g => String(g.id) === String(gigId));
        if (gig) {
          const artistArray = gig.artist ? String(gig.artist).split(',').map(a => a.trim()).filter(a => a !== "") : [];
          const artistBadgesHtml = artistArray.map(a => `<span class="artist-badge">${a}</span>`).join('');
          const formattedDate = gig.date ? String(gig.date).substring(0,10).replace(/-/g, '.') : '-';

          document.getElementById('content-container').innerHTML = `
            <div class="hero">
              <div class="artist-group">${artistBadgesHtml}</div>
              <h1>${gig.title}</h1>
              <div class="meta-grid">
                <div class="meta-item"><span>DATE</span><strong>${formattedDate}</strong></div>
                <div class="meta-item"><span>LOCATION</span><strong>${gig.location || '-'}</strong></div>
                <div class="meta-item"><span>PRICE</span><strong class="price">₩ ${Number(gig.price || 0).toLocaleString()}</strong></div>
              </div>
            </div>
            <div class="review-content">${gig.review || '작성된 후기가 없습니다.'}</div>
          `;
          
          document.getElementById('edit-btn').href = `edit.html?id=${gig.id}`;
          document.getElementById('action-buttons').style.display = 'flex';
        } else {
          document.getElementById('content-container').innerHTML = '<div class="loading-msg">존재하지 않는 기록입니다.</div>';
        }
      });

    document.getElementById('delete-btn').addEventListener('click', () => {
      if (confirm("정말로 이 공연 기록을 삭제할까요? 🥺")) {
        const btn = document.getElementById('delete-btn');
        btn.innerText = "삭제 중...⏳";
        
        fetch(scriptUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: "delete", id: gigId })
        })
        .then(res => res.json())
        .then(data => {
          alert("삭제되었습니다!");
          window.location.href = 'index.html';
        });
      }
    });
  </script>
</body>
</html>
