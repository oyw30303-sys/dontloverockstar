<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>공연 상세</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    * { box-sizing: border-box; }
    body { background-color: #F4F5F0; color: #111; font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; letter-spacing: -0.02em; margin: 0; padding: 70px 20px 100px 20px; }
    header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #F4F5F0; display: flex; align-items: center; padding: 0 20px; z-index: 1000; border-bottom: 2px solid #111; }
    .back-btn { color: #111; text-decoration: none; font-size: 1.5rem; font-weight: 900; margin-right: 15px; }
    header h1 { font-size: 1.1rem; margin: 0; color: #111; font-weight: 900; }

    .detail-card { background: #fff; border: 2px solid #111; border-radius: 16px; padding: 24px; box-shadow: 4px 4px 0px #111; margin-bottom: 20px; }
    .title { font-size: 1.4rem; font-weight: 900; margin: 0 0 20px 0; text-align: center; }
    
    .info-list { display: flex; flex-direction: column; gap: 12px; }
    .info-row { font-size: 0.95rem; font-weight: 700; color: #555; display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
    .info-label { white-space: nowrap; flex-shrink: 0; color: #444; }
    .info-value { color: #111; font-weight: 800; word-break: break-word; }
    
    .divider { height: 2px; background: #eee; margin: 22px 0; }
    
    .review-section label { display: block; font-size: 0.95rem; font-weight: 800; color: #111; margin-bottom: 8px; text-align: left; }
    .review-content { font-size: 1rem; font-weight: 600; color: #333; line-height: 1.6; white-space: pre-wrap; text-align: left; }

    .btn-group { display: flex; gap: 10px; margin-top: 30px; }
    .action-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 900; border: 2px solid #111; text-align: center; text-decoration: none; cursor: pointer; font-family: inherit; }
    .edit-btn { background: #D9F99D; color: #111; box-shadow: 3px 3px 0px #111; }
    .delete-btn { background: #FEE2E2; color: #DC2626; box-shadow: 3px 3px 0px #111; }
    .action-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #111; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; align-items: center; height: 70px; border-top: 2px solid #111; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
    .bottom-nav a { color: #888; text-decoration: none; font-size: 0.8rem; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bottom-nav a.active { color: #2563EB; }
    
    .bottom-nav .add-btn { background: #2563EB; color: #fff !important; width: 56px; height: 56px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; margin-top: -30px; border: 2px solid #111; box-shadow: none; transition: transform 0.1s; }
    .bottom-nav .add-btn:active { transform: translate(2px, 2px); }

    .loading-msg { text-align: center; font-weight: 800; margin-top: 50px; color: #888; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn">←</a>
    <h1>ARCHIVE DETAIL</h1>
  </header>

  <div id="content" class="loading-msg">정보를 불러오는 중... ⏳</div>

  <nav class="bottom-nav">
    <a href="index.html"><span>HOME</span></a>
    <a href="artist.html"><span>ARTIST</span></a>
    <a href="add.html" class="add-btn">+</a>
    <a href="calendar.html"><span>CALENDAR</span></a>
  </nav>

  <script>
    const currentUser = localStorage.getItem("rockArchiveUser");
    if (!currentUser) window.location.href = "login.html";

    const scriptUrl = "https://script.google.com/macros/s/AKfycbxlYgTHF-G5RhLTd6rIXKVYaXlZyVHLzh8ZdG4_gMvwhqTSNRQ0xokYrg33EV0a-3v8/exec";
    const params = new URLSearchParams(window.location.search);
    const gigId = params.get('id');
    const container = document.getElementById('content');

    function formatDateStr(dateVal) {
      if (!dateVal) return '';
      const str = String(dateVal).trim();
      const match = str.match(/(\d{4})[-\.\/](\d{1,2})[-\.\/](\d{1,2})/);
      if (match) {
        return `${match[1]}.${match[2].padStart(2, '0')}.${match[3].padStart(2, '0')}`;
      }
      return str.substring(0, 10).replace(/-/g, '.');
    }

    fetch(`${scriptUrl}?user=${encodeURIComponent(currentUser)}`)
      .then(res => res.json())
      .then(gigs => {
        const gig = gigs.find(g => String(g.id) === String(gigId));
        if (gig) {
          const formattedDate = formatDateStr(gig.date);
          const formattedPrice = gig.price ? Number(gig.price).toLocaleString() : '0';

          container.innerHTML = `
            <div class="detail-card">
              <h2 class="title">${gig.title}</h2>
              
              <div class="info-list">
                <div class="info-row">
                  <span class="info-label">🎤 아티스트:</span>
                  <span class="info-value">${gig.artist || ''}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">📅 날짜:</span>
                  <span class="info-value">${formattedDate}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">📍 장소:</span>
                  <span class="info-value">${gig.location || ''}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">💸 가격:</span>
                  <span class="info-value">₩ ${formattedPrice}</span>
                </div>
              </div>
              
              <div class="divider"></div>

              <div class="review-section">
                <label>💬 공연 후기</label>
                <div class="review-content">${gig.review || '작성된 후기가 없습니다.'}</div>
              </div>
              
              <div class="btn-group">
                <a href="edit.html?id=${gig.id}" class="action-btn edit-btn">수정하기</a>
                <button onclick="deleteGig('${gig.id}')" class="action-btn delete-btn">삭제하기</button>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = '<div class="loading-msg">해당 기록을 찾을 수 없습니다. 😢</div>';
        }
      });

    function deleteGig(id) {
      if (confirm("정말 이 공연 기록을 삭제하시겠습니까?")) {
        fetch(scriptUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: "delete", id: id })
        })
        .then(res => res.json())
        .then(data => {
          window.location.href = 'index.html';
        })
        .catch(err => {
          alert("삭제에 실패했습니다. 다시 시도해주세요.");
        });
      }
    }
  </script>
</body>
</html>
