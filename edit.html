<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>기록 수정</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    * { box-sizing: border-box; }
    body { background-color: #F4F5F0; color: #111; font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; letter-spacing: -0.02em; margin: 0; padding: 70px 20px 100px 20px; }
    
    header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #F4F5F0; display: flex; align-items: center; padding: 0 20px; z-index: 1000; border-bottom: 2px solid #111; }
    .back-btn { color: #111; text-decoration: none; font-size: 1.5rem; font-weight: 900; margin-right: 15px; }
    header h1 { font-size: 1.1rem; margin: 0; color: #111; font-weight: 900; }
    
    .form-group { margin-bottom: 22px; width: 100%; }
    .form-group label { display: block; color: #111; font-size: 0.95rem; margin-bottom: 8px; font-weight: 800; }
    
    .form-group input, .form-group textarea, input[type="date"] { width: 100%; background: #fff; border: 2px solid #111; color: #111; padding: 16px; border-radius: 12px; font-size: 1rem; font-weight: 600; outline: none; transition: box-shadow 0.2s, transform 0.2s; box-sizing: border-box; font-family: inherit; line-height: normal; }
    .form-group input:focus, .form-group textarea:focus, input[type="date"]:focus { box-shadow: 4px 4px 0px #D9F99D; transform: translate(-2px, -2px); }
    
    input[type="date"] { cursor: pointer; -webkit-appearance: none; appearance: none; display: block; height: 56px; }
    .form-group textarea { height: 140px; resize: none; line-height: 1.5; }

    .save-btn { display: block; width: 100%; background: #D9F99D; color: #111; text-align: center; padding: 18px; border-radius: 12px; font-size: 1.1rem; font-weight: 900; border: 2px solid #111; margin-top: 25px; box-shadow: 4px 4px 0px #111; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; font-family: inherit; }
    .save-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #111; }
    .save-btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; transform: none; border-color: #888; }
    .loading-msg { text-align: center; font-weight: 800; margin-top: 40px; color: #2563EB; }
  </style>
</head>
<body>
  <header>
    <a href="javascript:history.back()" class="back-btn">←</a>
    <h1>EDIT ARCHIVE</h1>
  </header>

  <div id="loading-msg" class="loading-msg">기존 정보를 불러오는 중... ⏳</div>

  <form id="gig-form" style="display: none; margin-top: 15px;">
    <div class="form-group"><label>공연 이름</label><input type="text" id="g-title" required></div>
    <div class="form-group"><label>출연 아티스트</label><input type="text" id="g-artist" required></div>
    
    <div class="form-group"><label>날짜</label><input type="date" id="g-date" required></div>
    <div class="form-group"><label>가격 (원)</label><input type="text" id="g-price" inputmode="numeric" required></div>

    <div class="form-group"><label>장소</label><input type="text" id="g-location"></div>
    <div class="form-group"><label>공연 후기</label><textarea id="g-review"></textarea></div>
    
    <button type="submit" class="save-btn" id="save-btn">수정 완료하기</button>
  </form>

  <script>
    const currentUser = localStorage.getItem("rockArchiveUser");
    if (!currentUser) window.location.href = "login.html";

    const scriptUrl = "https://script.google.com/macros/s/AKfycbxR-8LeeH1CtcrG5pdu9gRIpuIU54SYWwssgHWdGv8twzvt_pq0qUtVvDxb6z9CiitS/exec";
    const params = new URLSearchParams(window.location.search);
    const gigId = params.get('id');

    const priceInput = document.getElementById('g-price');
    priceInput.addEventListener('input', function (e) {
      let value = e.target.value.replace(/[^0-9]/g, '');
      if (value) value = Number(value).toLocaleString();
      e.target.value = value;
    });

    // 날짜를 YYYY-MM-DD 포맷으로 안전하게 변환하는 함수
    function parseDateToInput(dateVal) {
      if (!dateVal) return '';
      const d = new Date(dateVal);
      if (isNaN(d.getTime())) {
        return String(dateVal).substring(0, 10).replace(/\./g, '-');
      }
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    fetch(`${scriptUrl}?user=${encodeURIComponent(currentUser)}`)
      .then(res => res.json())
      .then(gigs => {
        const gig = gigs.find(g => String(g.id) === String(gigId));
        if(gig) {
          document.getElementById('g-title').value = gig.title || '';
          document.getElementById('g-artist').value = gig.artist || '';
          document.getElementById('g-date').value = parseDateToInput(gig.date);
          document.getElementById('g-price').value = gig.price ? Number(gig.price).toLocaleString() : '';
          document.getElementById('g-location').value = gig.location || '';
          document.getElementById('g-review').value = gig.review || '';

          document.getElementById('loading-msg').style.display = 'none';
          document.getElementById('gig-form').style.display = 'block';
        } else {
          document.getElementById('loading-msg').innerText = "데이터를 찾을 수 없습니다.";
        }
      });

    document.getElementById('gig-form').addEventListener('submit', function(e) {
      e.preventDefault(); 
      const btn = document.getElementById('save-btn');
      btn.innerText = "수정 중... ⏳";
      btn.disabled = true;

      const rawPrice = priceInput.value.replace(/,/g, '');

      const updatedGig = {
        action: "edit",
        id: gigId,
        title: document.getElementById('g-title').value,
        artist: document.getElementById('g-artist').value,
        date: document.getElementById('g-date').value,
        price: rawPrice,
        location: document.getElementById('g-location').value,
        review: document.getElementById('g-review').value
      };

      fetch(scriptUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(updatedGig)
      })
      .then(res => res.json())
      .then(data => {
        window.location.href = `detail.html?id=${gigId}`;
      })
      .catch(err => {
        alert("수정에 실패했습니다. 다시 시도해주세요.");
        btn.innerText = "수정 완료하기";
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
